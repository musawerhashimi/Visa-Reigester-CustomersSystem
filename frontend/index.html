<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, icon and description are the company's, and the company record
      lives in the database. They are filled in at runtime by DocumentHead.
      Deliberately blank here: a stock title or icon shown while the record
      loads would brand the tab as somebody else's site.

      An empty <title> keeps the browser from falling back to the URL, and
      the icon link is added only once there is a logo to point it at.
    -->
    <title></title>
    <meta name="description" content="" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
